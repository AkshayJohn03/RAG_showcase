# Qdrant is the supported vector DB (VECTOR_BACKEND=qdrant). No Postgres service:
# an earlier revision advertised pgvector with zero application code touching it,
# so it was removed rather than left as decoration. If pgvector support lands,
# it must arrive with a driver module + parity test, like qdrant-local did.
services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      VECTOR_BACKEND: qdrant
      QDRANT_URL: http://qdrant:6333
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
  qdrant:
    image: qdrant/qdrant:v1.9.2
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:6333/readyz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  qdrant_data:
