# Production topology: 2 API replicas + Qdrant StatefulSet.
# Secrets (API_KEY) come from a SealedSecret/vault injector in real clusters —
# never commit them. See docs/OPERATIONS.md.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-showcase
spec:
  replicas: 2
  selector:
    matchLabels: { app: rag-showcase }
  template:
    metadata:
      labels: { app: rag-showcase }
    spec:
      containers:
        - name: api
          image: rag-showcase:1.0.0
          ports: [{ containerPort: 8000 }]
          env:
            - { name: VECTOR_BACKEND, value: qdrant }
            - { name: QDRANT_URL, value: "http://qdrant:6333" }
            - name: API_KEY
              valueFrom: { secretKeyRef: { name: rag-secrets, key: api-key } }
          livenessProbe: { httpGet: { path: /health, port: 8000 }, initialDelaySeconds: 60, periodSeconds: 30 }
          readinessProbe: { httpGet: { path: /health, port: 8000 }, initialDelaySeconds: 45, periodSeconds: 15 }
          resources:
            requests: { cpu: "1", memory: 2Gi }
            limits: { cpu: "4", memory: 8Gi }   # embeddings are hungry on first load
---
apiVersion: v1
kind: Service
metadata:
  name: rag-showcase
spec:
  selector: { app: rag-showcase }
  ports: [{ port: 80, targetPort: 8000 }]
---
# Vector DB the API actually queries when VECTOR_BACKEND=qdrant.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: qdrant
spec:
  serviceName: qdrant
  replicas: 1
  selector:
    matchLabels: { app: qdrant }
  template:
    metadata:
      labels: { app: qdrant }
    spec:
      containers:
        - name: qdrant
          image: qdrant/qdrant:v1.9.2
          ports: [{ containerPort: 6333 }]
          volumeMounts: [{ name: qdrant-data, mountPath: /qdrant/storage }]
          resources:
            requests: { cpu: "500m", memory: 2Gi }
  volumeClaimTemplates:
    - metadata: { name: qdrant-data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 20Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: qdrant
spec:
  selector: { app: qdrant }
  ports: [{ port: 6333, targetPort: 6333 }]
# NOTE: collection provisioning lives in provision-job.yaml (separate file =
# separate lifecycle). A Job in this file would break `kubectl apply` reruns
# (Job specs are immutable) and tangle GitOps syncs.
